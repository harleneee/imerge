<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>IMerge | Free PDF Merger</title>

<link rel="stylesheet" href="imerge.css">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

</head>


<body>

<!-- BACKGROUND DECORATION -->

<div class="bg-blob blob1"></div>
<div class="bg-blob blob2"></div>


<div class="container">

<header>

<h1>IMerge</h1>

<p class="subtitle">
Merge multiple PDF files instantly — fast, private, and free.
</p>

</header>


<section class="card">

<label id="dropZone" class="drop-zone">

<input type="file" id="pdfs" multiple accept="application/pdf">

<div class="drop-text">

<h3>Drag & Drop PDFs</h3>

<p>or click to upload files</p>

</div>

</label>


<ul id="fileList" class="file-list"></ul>


<input
type="text"
id="filename"
class="filename"
placeholder="Rename merged file (optional)"
>


<button id="mergeBtn" class="merge-btn">

Merge PDFs

</button>


<div id="progressContainer" class="progress-container hidden">

<div class="spinner"></div>

<p>Merging PDFs...</p>

</div>

</section>


<footer class="copyright">
      <span>© 2026 IMerge. All rights reserved.</span>
      <span class="dot">•</span>
      <span>Built with <a href="https://pdf-lib.js.org/" target="_blank" rel="noreferrer">pdf-lib</a>.</span>
    </footer>
  </main>

</div>


<!-- SUCCESS MODAL -->

<div id="successModal" class="modal hidden">

<div class="modal-card">

<h2>Merge Complete</h2>

<p>Your merged PDF is ready.</p>

<button onclick="resetApp()">Merge Again</button>

</div>

</div>


<script src="https://cdn.jsdelivr.net/npm/pdf-lib/dist/pdf-lib.min.js"></script>
<script src="imerge.js"></script>

</body>

</html>
